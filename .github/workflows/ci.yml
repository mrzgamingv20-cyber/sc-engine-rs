name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    name: Rust tests (host)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - name: Cache dependencies
        uses: Swatinem/rust-cache@v2

      - name: Run tests
        run: cargo test --all

      - name: Run clippy
        run: cargo clippy --all --all-targets -- -D warnings

  build-android:
    name: Build Android arm64 (Rust + C++ + assembly)
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android

      - name: Cache Rust
        uses: Swatinem/rust-cache@v2
        with:
          key: android-arm64

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"

      - name: Install cargo-ndk
        run: cargo install cargo-ndk

      - name: Install Android NDK
        uses: nttld/setup-ndk@v1
        id: setup-ndk
        with:
          ndk-version: r27
          add-to-path: false

      - name: Build native library (Rust + C++ + asm)
        run: cargo ndk -t arm64-v8a -o android/app/src/main/jniLibs build --release
        env:
          ANDROID_NDK_HOME: ${{ steps.setup-ndk.outputs.ndk-path }}
          NDK_HOME: ${{ steps.setup-ndk.outputs.ndk-path }}

      - name: Build APK
        run: gradle -p android assembleDebug --no-daemon

      - name: Collect native build artifacts
        run: |
          mkdir -p artifacts/native
          find target -name 'libsc_render.a' -exec cp {} artifacts/native/ \;
          find target -name 'libengine_app.so' -exec cp {} artifacts/native/ \;

      - name: Upload native library
        uses: actions/upload-artifact@v4
        with:
          name: engine-app-android-arm64
          path: android/app/src/main/jniLibs/arm64-v8a/*.so

      - name: Upload native build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: native-build-artifacts
          path: artifacts/native/

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: sc-engine-debug-apk
          path: android/app/build/outputs/apk/debug/*.apk
